[shortcut]
toggle-elevated-rail-transparency=Toggle Elevated Rail Transparency

[mod-setting-name]
rail-transparency=Rail Transparency
support-transparency=Support Transparency
selection-box-size=Selection Box Size

[mod-setting-description]
rail-transparency=How transparent elevated rails should be when transparency is enabled (100 = invisible, also can't be clicked)
support-transparency=How transparent rail supports and rail ramps should be when transparency is enabled (100 = invisible, also can't be clicked)

[message]
elevated-rails-transparent=Elevated rails, ramps, and supports are now transparent
elevated-rails-normal=Elevated rails, ramps, and supports are now visible