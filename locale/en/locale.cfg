[shortcut]
toggle-elevated-rail-transparency=Toggle Elevated Rail Transparency

[mod-setting-name]
rail-transparency=Rail Transparency
support-transparency=Support Transparency

[mod-setting-description]
rail-transparency=How transparent elevated rails should be when transparency is enabled (0 = fully transparent/invisible, 100 = fully opaque/normal). You must restart the game for changes to take effect.
support-transparency=How transparent rail supports and rail ramps should be when transparency is enabled (0 = fully transparent/invisible, 100 = fully opaque/normal). You must restart the game for changes to take effect.

[message]
elevated-rails-transparent=Elevated rails, ramps, and supports are now transparent
elevated-rails-normal=Elevated rails, ramps, and supports are now visible